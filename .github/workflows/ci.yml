name: ci-security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew build -x test

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep --config=auto --json --output /src/semgrep-report.json /src
      - uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep
          path: semgrep-report.json

  sast-codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: sast-codeql
          path: sarif-results

  sca-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs --scanners vuln --format json --output /src/trivy-sca.json /src
      - uses: actions/upload-artifact@v4
        with:
          name: sca-trivy
          path: trivy-sca.json