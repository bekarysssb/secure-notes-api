name: secure-notes
services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/certs:ro
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    restart: unless-stopped
    depends_on: [api]

  api:
    build: .
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/secure-notes
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/secure-notes/protocol/openid-connect/certs
      AES_KEY_FILE: /run/secrets/aes_key
    secrets: [aes_key]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./keycloak/realm-secure-notes.json:/opt/keycloak/data/import/realm-secure-notes.json:ro
    networks: [edge, internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

secrets:
  aes_key:
    file: ./secrets/aes_key.txt